name: core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
        include:
          - os: ubuntu-22.04
            python: '3.8'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,media,diagnostics]"
      - run: python -m pytest -q
      - run: python tools/check_release.py
      - run: python -m build
      - run: python -m twine check dist/*
  installed-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv "$RUNNER_TEMP/embodify-verify"
      - run: '"$RUNNER_TEMP/embodify-verify/bin/python" -m pip install dist/*.whl'
      - working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/embodify-verify/bin/embodify-mcp-smoke"
          "$RUNNER_TEMP/embodify-verify/bin/embodify-mcp-smoke" --remote
